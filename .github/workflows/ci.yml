name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          test -f extension.toml
          test -f languages/gltf/config.toml
          test -f languages/gltf/highlights.scm
      - name: Check sample glTF JSON
        run: node -e "JSON.parse(require('fs').readFileSync('fixtures/triangle.gltf', 'utf8'))"
